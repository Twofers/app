version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    ignore:
      # Expo SDK packages are version-locked to the installed SDK (currently
      # ~54.0.35). Left unconstrained, Dependabot proposed expo-web-browser
      # 15.0.11 -> 57.0.2, expo-status-bar 3.0.9 -> 57.0.1 and react-native
      # 0.81.5 -> 0.86.2 — all Expo SDK 57, none of which build against SDK 54.
      # These move only through a deliberate SDK upgrade with
      # `npx expo install --fix`, never one package at a time.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      # Community React Native modules: Expo pins compatible ranges for these
      # too, so take patches and leave feature versions to the SDK upgrade.
      - dependency-name: "react-native-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Scoped RN community packages — "react-native-*" does NOT match names
      # starting with "@", a gap the first corrected run exposed by proposing
      # @react-native-community/datetimepicker 8.4.4 -> 9.1.0 (PR #47) and
      # @react-native-async-storage/async-storage 2.2.0 -> 3.1.1 (PR #48),
      # both pinned by Expo SDK 54 (expo/bundledNativeModules.json). CI passed
      # on both because it runs vitest/typecheck, not a native build — green
      # checks are not evidence of SDK compatibility for native modules.
      # eslint-config-expo is SDK-pinned too (~10.0.0).
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "eslint-config-expo"
    groups:
      # Everything the Expo SDK does not pin — supabase-js, date-fns,
      # playwright and friends. This is where dependency security fixes
      # actually land, so it stays on patch+minor.
      sdk-independent-updates:
        update-types:
          - patch
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # init/autobuild/analyze are one product and must move together. Bumping
      # one alone fails the run outright: PR #28 (analyze 3.37.3 -> 4.37.3)
      # died on "Loaded a configuration file for version '3.37.3', but running
      # version '4.37.3'".
      codeql-action:
        patterns:
          - "github/codeql-action*"
