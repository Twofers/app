name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  secret-scan:
    # Release-gate area 1: no secret may enter the repo or its history.
    # Runs on every push/PR; needs no repo secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so a secret in any past commit is caught

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz"
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree + git history for secrets
        run: gitleaks detect --source . --redact --no-banner --config .gitleaks.toml --exit-code 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Localization gate: en/es/ko key parity + every t() key resolvable in
      # en.json. Kept out of the pretest hook (a locked test pins that string);
      # enforced here so untranslated copy can't merge.
      - name: i18n key parity
        run: npm run check:i18n-keys

      # Second half of the localization gate: catches keys that only exist as a
      # t() defaultValue, which renders English to es/ko users while key parity
      # still passes. Placeholder drift between locales fails here too.
      - name: i18n defaultValue gaps
        run: node scripts/check-i18n-defaultvalue-gaps.mjs

      - name: Test
        run: npm run test

      # Audit F-012: fail when docs/release-audit/generated-state.* no longer
      # match the code (versions, migration count, function list, flags).
      - name: Release-state drift check
        run: npm run gate:release-state
