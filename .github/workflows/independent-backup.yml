name: Independent encrypted backup

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.INDEPENDENT_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install repository dependencies
        run: npm ci --ignore-scripts
      - name: Install signed distro backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age curl ca-certificates

          # postgresql-client-17, not plain postgresql-client. Supabase runs
          # PostgreSQL 17.6 and Ubuntu 24.04's default client is 16, so pg_dump
          # aborts with "server version mismatch" before writing a byte —
          # pg_dump refuses to dump a server newer than itself.
          #
          # 17 is not in the runner image's repositories (the preinstalled 16.14
          # is baked into the image, not served from a live PGDG source), so add
          # the official PostgreSQL APT repository. The key is fetched over
          # HTTPS from postgresql.org and apt verifies every package signature
          # against it via signed-by.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # pg_wrapper picks the highest installed version, but be explicit so a
          # future image change cannot silently reintroduce an older client.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          # awscli is deliberately NOT installed via apt. Ubuntu 24.04 dropped it
          # from the archive ("Package 'awscli' has no installation candidate",
          # exit 100), and GitHub-hosted runners already ship AWS CLI v2. Assert
          # the tools this job depends on are actually present rather than
          # discovering it halfway through a backup.
          aws --version
          age --version
          pg_dump --version

          # Fail here, loudly, rather than after the dump starts.
          dump_major="$(pg_dump --version | grep -oE '[0-9]+' | head -n 1)"
          if [[ "$dump_major" -lt 17 ]]; then
            echo "pg_dump is major version $dump_major but the server is 17.x; refusing to run." >&2
            exit 2
          fi
      - name: Materialize the Supabase database CA, when provided
        env:
          BACKUP_DB_ROOT_CERT_PEM: ${{ secrets.BACKUP_DB_ROOT_CERT_PEM }}
        run: |
          if [ -n "$BACKUP_DB_ROOT_CERT_PEM" ]; then
            umask 077
            printf '%s\n' "$BACKUP_DB_ROOT_CERT_PEM" > "$RUNNER_TEMP/supabase-db-ca.crt"
            echo "BACKUP_DB_ROOT_CERT=$RUNNER_TEMP/supabase-db-ca.crt" >> "$GITHUB_ENV"
          else
            echo "::warning::BACKUP_DB_ROOT_CERT_PEM is not configured — pg_dump will use sslmode=require without certificate verification."
          fi

      - name: Create, encrypt, and upload immutable backup
        env:
          SUPABASE_DB_URL: ${{ secrets.BACKUP_SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BACKUP_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_DAILY_RETENTION_DAYS: "7"
          BACKUP_MONTHLY_RETENTION_DAYS: "90"
          BACKUP_MAX_ARCHIVE_BYTES: "900000000"
          BACKUP_MAX_STORED_BYTES: "9500000000"
          CLOUDFLARE_API_TOKEN: ${{ secrets.BACKUP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          STRIPE_BACKUP_RESTRICTED_KEY: ${{ secrets.BACKUP_STRIPE_READ_KEY }}
          BACKUP_SUCCESS_HEARTBEAT_URL: ${{ secrets.BACKUP_SUCCESS_HEARTBEAT_URL }}
        run: bash scripts/security/run-independent-backup.sh
      - name: Notify independent monitor on failure
        if: failure()
        env:
          BACKUP_FAILURE_WEBHOOK_URL: ${{ secrets.BACKUP_FAILURE_WEBHOOK_URL }}
        run: |
          if [ -n "$BACKUP_FAILURE_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"status":"failed","workflow":"independent-production-backup"}' \
              "$BACKUP_FAILURE_WEBHOOK_URL" >/dev/null
          fi
