# English regression: deal-quality rules on English copy.
# Policy: do not merge PRs that fail this job until tests are fixed.
name: English regression

permissions:
  contents: read

on:
  pull_request:
    branches: [main, protect/**]
  push:
    branches: [main, protect/**, chore/**]

jobs:
  english-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: English regression (deal quality)
        run: npm run test:english
