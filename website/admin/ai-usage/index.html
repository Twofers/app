<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Usage | Twofer Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="stylesheet" href="/styles.css?v=20260807-density-audit" />
    <script src="/admin/admin-guard.js?v=20260731-admin-session"></script>
  </head>
  <body class="admin-shell">
    <header class="site-header"><nav class="nav" aria-label="Admin navigation">
      <a class="brand" href="/admin"><span>Twofer Admin</span></a>
      <div class="nav-actions"><a class="button button-small" href="/admin/login" data-admin-login-link>Login</a><button class="button button-small button-secondary" type="button" data-admin-sign-out hidden>Sign out</button></div>
    </nav></header>
    <main class="admin-main">
      <div class="admin-title-row">
        <div><p class="admin-kicker">Finance &amp; AI</p><h1>AI Usage</h1><p class="lede">Look up business quotas and use the operating report for provider health, spend, and failures.</p></div>
        <span class="admin-badge" data-admin-status>Checking session</span>
      </div>
      <div class="admin-actions">
        <a class="button button-small" href="/admin/ai-operating-report">Open AI operating report</a>
        <a class="button button-small button-secondary" href="/admin/ai-prompts">Manage prompts</a>
      </div>
      <section class="admin-section">
        <form class="admin-form" data-ai-lookup-form>
          <label class="full">Owner account
            <input name="query" required maxlength="320" placeholder="Owner email or user ID" />
          </label>
          <button class="button" type="submit">Look up AI usage</button>
        </form>
        <p class="status" data-ai-usage-status role="status" aria-live="polite"></p>
      </section>
      <section class="admin-section" data-ai-usage-results hidden>
        <div class="admin-section-header"><div><h2 data-ai-owner>Owner usage</h2><p>Monthly counts use the same quota ledger enforced by generation functions.</p></div></div>
        <div data-ai-businesses></div>
      </section>
    </main>
    <script src="/admin/admin-shell.js?v=20260731-admin-session"></script>
    <script src="/admin/ai-usage.js?v=20260728-admin-ops"></script>
  </body>
</html>
